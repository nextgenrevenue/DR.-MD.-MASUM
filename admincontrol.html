<body data-auto-load-components>

  <!-- ===== কন্টেইনার ===== -->
  <div id="header-container"></div>
  
  <div class="flex">
    <div id="sidebar-container"></div>
    
    <!-- ===== মেইন কন্টেন্ট ===== -->
    <div class="main-content flex-1">
      <div class="max-w-6xl mx-auto">
        
        <!-- হেডার -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
          <div>
            <a href="userdashboard.html" class="inline-flex items-center text-sm font-medium text-indigo-600 hover:text-indigo-800 mb-2 transition-colors">
              <i class="fas fa-arrow-left mr-2"></i> ড্যাশবোর্ডে ফিরে যান
            </a>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-3">
              <i class="fas fa-user-shield text-purple-600"></i> অ্যাডমিন ও রোল ম্যানেজার প্যানেল
            </h1>
            <p class="text-sm text-slate-500 mt-1">শুধুমাত্র ওনার (Owner) ব্যবহারের জন্য। এখান থেকে ইউজারদের রোল (Role) পরিবর্তন করা যায়।</p>
          </div>
          
          <div class="flex gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3">
              <div class="p-3 rounded-lg bg-purple-50 text-purple-600"><i class="fas fa-user-cog text-xl"></i></div>
              <div>
                <p class="text-xs text-slate-400 font-semibold">মোট অ্যাডমিন</p>
                <h3 id="totalAdminsCount" class="text-xl font-bold text-slate-700">০</h3>
              </div>
            </div>
          </div>
        </div>

        <!-- গ্রিড -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          
          <!-- বাম প্যানেল: সার্চ -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
            <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">
              <i class="fas fa-search text-indigo-500 mr-2"></i> ইউজার খুঁজুন
            </h2>
            
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-2">ইউজারের মোবাইল নম্বর</label>
                <div class="relative">
                  <input type="tel" id="searchPhone" placeholder="01XXXXXXXXX" 
                         class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 transition-colors">
                  <i class="fas fa-phone absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
              </div>
              
              <button onclick="searchUserByPhone()" class="w-full owner-gradient text-white py-2.5 rounded-xl font-semibold text-sm hover:opacity-95 shadow-sm transition-opacity">
                <i class="fas fa-search-plus mr-1"></i> ডাটা সার্চ করুন
              </button>
            </div>

            <div id="searchResultArea" class="hidden mt-6 pt-6 border-t border-slate-100 space-y-4">
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">

                  <option value="admin">Admin (ম্যানেজমেন্ট স্টাফ)</option>
                  <option value="owner">Owner (মালিক/সুপার অ্যাডমিন)</option>

              <button onclick="updateUserRole()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow-sm transition-colors">

          <!-- ডান প্যানেল: তালিকা -->
          <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
              <h2 class="text-lg font-bold text-slate-800">
                <i class="fas fa-users-cog text-purple-500 mr-2"></i> অ্যাডমিন ও ওনারদের তালিকা
              </h2>
              <button onclick="loadPrivilegedUsers()" class="text-xs font-bold text-indigo-600 hover:underline">
                <i class="fas fa-sync-alt mr-1"></i> রিফ্রেশ করুন
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-slate-400 text-xs font-bold uppercase">
                    <th class="py-3 px-4">নাম ও ফোন</th>
                    <th class="py-3 px-4">ইমেইল</th>
                    <th class="py-3 px-4">রোল</th>
                    <th class="py-3 px-4 text-center">অ্যাকশন</th>
                  </tr>
                </thead>
                <tbody id="privilegedUsersTable" class="text-sm text-slate-600 divide-y divide-slate-50">
                  <tr>
                    <td colspan="4" class="py-8 text-center text-slate-400">ডাটা লোড হচ্ছে...</td>

  <!-- ============================================================ -->
  <!-- কাস্টম জাভাস্ক্রিপ্ট -->
  <!-- ============================================================ -->
  <script>
    // ============================================================
    // ১. ফায়ারবেস কনফিগারেশন 
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDAdGUtNVgs5UspQeH8hL0i-L0WvPpOWnE",
        authDomain: "appointment-e2050.firebaseapp.com",
        projectId: "appointment-e2050",
        storageBucket: "appointment-e2050.firebasestorage.app",
        messagingSenderId: "367447068370",
        appId: "1:367447068370:web:8e111bb010a19d21eda70b",
        measurementId: "G-CRLSV1JJMQ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentSearchedUserPhone = null;

    // ============================================================
    // ২. সেশন-ভিত্তিক অথেন্টিকেশন চেক (ওনার ভেরিফিকেশন)
    // ============================================================
    async function checkOwnerAccess() {
      const isLoggedIn = sessionStorage.getItem('adminLoggedIn');
      const loginTime = sessionStorage.getItem('loginTime');
      const currentTime = new Date().getTime();
      const userPhone = sessionStorage.getItem('loggedInUser') || sessionStorage.getItem('userPhone');

      if (!isLoggedIn || !loginTime || (currentTime - parseInt(loginTime)) > (2 * 60 * 60 * 1000) || !userPhone) {
        sessionStorage.clear();
        Swal.fire('সেশন শেষ!', 'আবার লগইন করুন', 'error').then(() => {
          window.location.href = 'login.html';
        });
        return false;
      }

      try {
        const userDoc = await db.collection('users').doc(userPhone).get();
        
        if (!userDoc.exists) {
          Swal.fire('অ্যাক্সেস রিজেক্টেড!', 'ইউজার খুঁজে পাওয়া যায়নি', 'error').then(() => {
            window.location.href = 'login.html';
          });
          return false;
        }

        const userData = userDoc.data();
        const userRole = userData.role || 'user';

        if (userRole === 'admin') {
          Swal.fire({
            title: 'অ্যাক্সেস রিজেক্টেড!',
            text: 'এই পেজটি শুধুমাত্র ওনারদের জন্য। আপনি অ্যাডমিন হিসেবে ড্যাশবোর্ডে রিডিরেক্ট হচ্ছেন।',
            icon: 'warning',
            timer: 3000,
            showConfirmButton: true
          }).then(() => {
            window.location.href = 'dashboard.html';
          });
          return false;
        }

        if (userRole === 'user') {
          Swal.fire({
            title: 'অ্যাক্সেস রিজেক্টেড!',
            text: 'এই পেজটি শুধুমাত্র ওনারদের জন্য। আপনি ইউজার ড্যাশবোর্ডে রিডিরেক্ট হচ্ছেন।',
            icon: 'warning',
            timer: 3000,
            showConfirmButton: true
          }).then(() => {
            window.location.href = 'userdashboard.html';
          });
          return false;
        }

        if (userRole === 'owner') {
          console.log('✅ ওনার ভেরিফাইড:', userPhone);
          return true;
        }

        Swal.fire('অ্যাক্সেস রিজেক্টেড!', 'আপনার রোলটি অনুমোদিত নয়।', 'error').then(() => {
          window.location.href = 'userdashboard.html';
        });
        return false;

      } catch (error) {
        console.error('❌ ভেরিফিকেশন ত্রুটি:', error);
        Swal.fire('ত্রুটি!', 'ভেরিফিকেশন করতে সমস্যা হয়েছে', 'error').then(() => {
          window.location.href = 'login.html';
        });
        return false;
      }
    }

    // ============================================================
    // ৩. পেজ লোড হলে অথেন্টিকেশন চেক
    // ============================================================
    (async function init() {
      const isOwner = await checkOwnerAccess();
      if (isOwner) {
        loadPrivilegedUsers();
      }
    })();

    // ============================================================
    // ৪. সকল অ্যাডমিন এবং ওনারদের ডাটাবেজ থেকে নিয়ে আসা
    // ============================================================
    async function loadPrivilegedUsers() {
      const tbody = document.getElementById('privilegedUsersTable');
      try {
        const adminsSnapshot = await db.collection('users').where('role', 'in', ['admin', 'owner']).get();
        
        document.getElementById('totalAdminsCount').textContent = adminsSnapshot.size;
        
        if (adminsSnapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">কোনো প্রিভিলেজড ইউজার পাওয়া যায়নি।</td></tr>`;
          return;
        }

        let html = '';
        adminsSnapshot.forEach(doc => {
          const data = doc.data();
          const uid = doc.id;
          const roleBadgeColor = data.role === 'owner' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700';
          const roleName = data.role === 'owner' ? 'Owner' : 'Admin';

          html += `
            <tr class="hover:bg-slate-50/80 transition-colors">
              <td class="py-3.5 px-4">
                <div class="font-semibold text-slate-700">${data.name || 'নাম নেই'}</div>
                <div class="text-xs text-slate-400">${data.phone || 'ফোন নেই'}</div>
              </td>
              <td class="py-3.5 px-4 text-slate-500">${data.email || 'N/A'}</td>
              <td class="py-3.5 px-4">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${roleBadgeColor}">${roleName}</span>
              </td>
              <td class="py-3.5 px-4 text-center">
                <button onclick="demoteToUser('${uid}', '${data.name}')" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold px-3 py-1.5 rounded-lg transition-colors">
                  <i class="fas fa-user-minus mr-1"></i> রোল সরান
                </button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;

      } catch (error) {
        console.error("ডাটা লোড করতে সমস্যা হয়েছে:", error);
        tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-rose-500">ডাটা লোড ব্যর্থ হয়েছে।</td></tr>`;
      }
    }

    // ============================================================
    // ৫. ফোন নম্বর দিয়ে ইউজার সার্চ করার লজিক
    // ============================================================
    async function searchUserByPhone() {
      const phoneInput = document.getElementById('searchPhone').value.trim();
      const resultArea = document.getElementById('searchResultArea');
      
      if (!phoneInput) {
        Swal.fire('দুঃখিত!', 'অনুগ্রহ করে একটি ফোন নম্বর লিখুন।', 'warning');
        return;
      }

      const cleanedPhone = cleanAndFormatPhone(phoneInput);
      
      if (!cleanedPhone) {
        Swal.fire('দুঃখিত!', 'সঠিক বাংলাদেশি ফোন নম্বর লিখুন (যেমন: 017XXXXXXXX)', 'warning');
        return;
      }

      Swal.showLoading();
      try {
        const userDoc = await db.collection('users').doc(cleanedPhone).get();
        Swal.close();

        if (!userDoc.exists) {
          resultArea.classList.add('hidden');
          currentSearchedUserPhone = null;
          Swal.fire('ইউজার পাওয়া যায়নি!', 'এই ফোন নম্বরে কোনো অ্যাকাউন্ট রেজিস্টার্ড নেই।', 'info');
          return;
        }

        const userData = userDoc.data();
        currentSearchedUserPhone = cleanedPhone;

        document.getElementById('resName').textContent = userData.name || 'নাম বিহীন ইউজার';
        document.getElementById('resPhone').innerHTML = `<i class="fas fa-phone-alt mr-1"></i> ${userData.phone || cleanedPhone}`;
        
        const badge = document.getElementById('resBadge');
        const currentRole = userData.role || 'user';
        badge.textContent = currentRole.toUpperCase();
        
        if (currentRole === 'owner') {
          badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-700";
        } else if (currentRole === 'admin') {
          badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700";
        } else {
          badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600";
        }

        document.getElementById('newRoleSelect').value = currentRole;
        resultArea.classList.remove('hidden');

      } catch (error) {
        Swal.close();
        console.error("সার্চ করতে সমস্যা হয়েছে:", error);
        Swal.fire('ভুল হয়েছে!', 'সার্চ করার সময় কোনো ইন্টারনাল সমস্যা হয়েছে।', 'error');
      }
    }

    // ============================================================
    // ৬. ফোন নম্বর ক্লিন করার ফাংশন
    // ============================================================
    function cleanAndFormatPhone(phoneRaw) {
      let input = phoneRaw.trim();
      
      const banglaDigits = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
      let converted = input.replace(/[০-৯]/g, function(w) { return banglaDigits[w]; });
      
      converted = converted.replace(/\D/g, '');
      
      if (converted.startsWith('880')) {
        converted = converted.substring(3);
      }
      
      if (converted.length === 10) {
        converted = '0' + converted;
      }
      
      const bdPhoneRegex = /^01[3-9]\d{8}$/;
      if (!bdPhoneRegex.test(converted)) {
        return null;
      }
      
      return converted;
    }

    // ============================================================
    // ৭. ইউজারের রোল পরিবর্তন/আপডেট করা
    // ============================================================
    async function updateUserRole() {
      if (!currentSearchedUserPhone) {
        Swal.fire('ত্রুটি!', 'কোনো ইউজার সিলেক্ট করা নেই', 'error');
        return;
      }

      const newRole = document.getElementById('newRoleSelect').value;

      Swal.fire({
        title: 'আপনি কি নিশ্চিত?',
        text: `ইউজারের রোলটি পরিবর্তন করে "${newRole.toUpperCase()}" করতে চাচ্ছেন?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#7c3aed',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'হ্যাঁ, আপডেট করুন',
        cancelButtonText: 'বাতিল'
      }).then(async (result) => {
        if (result.isConfirmed) {
          Swal.showLoading();
          try {
            await db.collection('users').doc(currentSearchedUserPhone).update({
              role: newRole
            });
            
            Swal.fire('সফল হয়েছে!', 'ইউজার রোল সফলভাবে আপডেট হয়েছে।', 'success');
            document.getElementById('searchResultArea').classList.add('hidden');
            document.getElementById('searchPhone').value = '';
            currentSearchedUserPhone = null;
            
            loadPrivilegedUsers();
          } catch (error) {
            console.error("রোল আপডেট করতে সমস্যা:", error);
            Swal.fire('ব্যর্থ হয়েছে!', 'রোল আপডেট করা যায়নি।', 'error');
          }
        }
      });
    }

    // ============================================================
    // ৮. তালিকা থেকে সরাসরি কাউকে সাধারণ ইউজার বানিয়ে দেওয়া (Demote)
    // ============================================================
    function demoteToUser(uid, name) {
      Swal.fire({
        title: 'রোল বাতিল করবেন?',
        text: `আপনি কি নিশ্চিত যে "${name}" এর স্পেশাল রোল বাতিল করে সাধারণ ইউজার (User) বানাতে চান?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#df1c1c',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'হ্যাঁ, রোল বাতিল করুন',
        cancelButtonText: 'বাতিল'
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            await db.collection('users').doc(uid).update({
              role: 'user'
            });
            Swal.fire('রিমুভড!', 'রোলটি সফলভাবে বাতিল করা হয়েছে।', 'success');
            loadPrivilegedUsers();
          } catch (error) {
            Swal.fire('ভুল হয়েছে!', 'রোল সরাতে কোনো সমস্যা হয়েছে।', 'error');
          }
        }
      });
    }
  </script>
