<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাসওয়ার্ড পরিবর্তন</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="components-inline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans Bengali', sans-serif; background: #f0f4f8; }
    
    .password-page {
      max-width: 500px;
      margin: 80px auto 40px;
      padding: 0 20px;
    }
    
    .password-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    
    .password-card h2 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .password-card h2 i {
      color: #3b82f6;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 14px;
      color: #334155;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: 0.15s;
    }
    
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    
    .password-strength {
      height: 4px;
      border-radius: 4px;
      margin-top: 6px;
      transition: all 0.3s ease;
    }
    .password-strength.weak { background: #ef4444; width: 33%; }
    .password-strength.medium { background: #f59e0b; width: 66%; }
    .password-strength.strong { background: #22c55e; width: 100%; }
    .password-strength.empty { background: #e2e8f0; width: 0%; }
    
    .btn-change {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    
    .btn-change:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    }
    
    #passwordMsg {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper input {
      width: 100%;
      padding-right: 45px;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      transition: color 0.3s;
    }
    
    .toggle-password:hover {
      color: #475569;
    }
  </style>
</head>
<body data-auto-load-components>
  <div id="header-container"></div>
  
  <div style="display: flex; min-height: calc(100vh - 64px); margin-top: 64px;">
    <div id="sidebar-container"></div>
    
    <main style="flex: 1; padding: 24px; background: #f0f4f8;">
      <div class="password-page">
        <div class="password-card">
          <h2><i class="fas fa-key"></i> পাসওয়ার্ড পরিবর্তন</h2>
          
          <div id="passwordMsg"></div>
          
          <div class="form-group">
            <label>বর্তমান পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="currentPassword" placeholder="বর্তমান পাসওয়ার্ড লিখুন">
              <span class="toggle-password" onclick="togglePassword('currentPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>
          
          <div class="form-group">
            <label>নতুন পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" placeholder="নতুন পাসওয়ার্ড লিখুন (৬ অক্ষরের বেশি)">
              <span class="toggle-password" onclick="togglePassword('newPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
            <div class="password-strength empty"></div>
            <small style="color: #94a3b8; font-size: 12px;">পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে</small>
          </div>
          
          <div class="form-group">
            <label>নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="আবার নতুন পাসওয়ার্ড লিখুন">
              <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>
          
          <button class="btn-change" id="changePasswordBtn">
            <i class="fas fa-sync-alt"></i> পাসওয়ার্ড পরিবর্তন করুন
          </button>
        </div>
      </div>
    </main>
  </div>
  
  <div id="footer-container"></div>
  
  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const icon = input.parentElement.querySelector('.toggle-password i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      // পাসওয়ার্ড শক্তি চেক
      document.getElementById('newPassword').addEventListener('input', function() {
        const strength = this.value.length === 0 ? 'empty' :
                         this.value.length < 6 ? 'weak' :
                         this.value.length < 10 ? 'medium' : 'strong';
        const indicator = document.querySelector('.password-strength');
        indicator.className = `password-strength ${strength}`;
      });
      
      // পাসওয়ার্ড পরিবর্তন
      document.getElementById('changePasswordBtn').addEventListener('click', function() {
        const current = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const msgDiv = document.getElementById('passwordMsg');
        
        if (!current || !newPass || !confirm) {
          msgDiv.textContent = 'সব ফিল্ড পূরণ করুন';
          msgDiv.style.display = 'block';
          msgDiv.style.background = '#fee2e2';
          msgDiv.style.color = '#dc2626';
          msgDiv.style.border = '1px solid #fecaca';
          return;
        }
        
        if (newPass.length < 6) {
          msgDiv.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে';
          msgDiv.style.display = 'block';
          msgDiv.style.background = '#fee2e2';
          msgDiv.style.color = '#dc2626';
          msgDiv.style.border = '1px solid #fecaca';
          return;
        }
        
        if (newPass !== confirm) {
          msgDiv.textContent = 'নতুন পাসওয়ার্ড মিলছে না';
          msgDiv.style.display = 'block';
          msgDiv.style.background = '#fee2e2';
          msgDiv.style.color = '#dc2626';
          msgDiv.style.border = '1px solid #fecaca';
          return;
        }
        
        // ComponentLoader এর changePassword ফাংশন কল
        ComponentLoader.changePassword(current, newPass)
          .then((result) => {
            msgDiv.textContent = result.message;
            msgDiv.style.display = 'block';
            msgDiv.style.background = '#dcfce7';
            msgDiv.style.color = '#16a34a';
            msgDiv.style.border = '1px solid #bbf7d0';
            
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.querySelector('.password-strength').className = 'password-strength empty';
            
            Swal.fire('✅ সফল!', result.message, 'success');
            
            setTimeout(() => {
              msgDiv.style.display = 'none';
            }, 3000);
          })
          .catch((error) => {
            msgDiv.textContent = error.message || 'পাসওয়ার্ড পরিবর্তন করতে সমস্যা হয়েছে';
            msgDiv.style.display = 'block';
            msgDiv.style.background = '#fee2e2';
            msgDiv.style.color = '#dc2626';
            msgDiv.style.border = '1px solid #fecaca';
            
            Swal.fire('❌ ত্রুটি!', error.message || 'পাসওয়ার্ড পরিবর্তন করতে সমস্যা হয়েছে', 'error');
          });
      });
      
      // Enter key
      document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('changePasswordBtn').click();
        }
      });
    });
  </script>
</body>
</html>
